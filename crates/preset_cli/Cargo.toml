[package]
name = "audiflow-preset-editor"
description = "CLI and local server for editing audiflow preset configurations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["podcast", "playlist", "preset", "editor"]
categories = ["command-line-utilities"]

[[bin]]
name = "audiflow-editor"
path = "src/main.rs"

[dependencies]
preset_core = { workspace = true }
preset_server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
