[package]
name = "audiflow-smartplaylist-editor"
description = "CLI and local server for editing audiflow smart playlist configurations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["podcast", "playlist", "editor"]
categories = ["command-line-utilities"]

[[bin]]
name = "audiflow-editor"
path = "src/main.rs"

[dependencies]
sp_core = { package = "audiflow-smartplaylist-core", path = "../sp_core", version = "2.0.1" }
sp_server = { package = "audiflow-smartplaylist-server", path = "../sp_server", version = "2.0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
