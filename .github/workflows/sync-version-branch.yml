name: Sync version branch

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward v2 to main
        run: |
          git fetch origin v2
          if git merge-base --is-ancestor origin/v2 origin/main; then
            git push origin origin/main:refs/heads/v2
          else
            echo "::warning::v2 has diverged from main — skipping fast-forward"
          fi
