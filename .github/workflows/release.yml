name: Release

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
      major: ${{ steps.parse.outputs.major }}
      branch: ${{ steps.parse.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse version and schema info
        id: parse
        run: |
          semver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          major=$(echo "$semver" | cut -d. -f1)
          if [ -z "$semver" ] || [ -z "$major" ]; then
            echo "::error::Failed to parse version from Cargo.toml (semver='$semver', major='$major')"
            exit 1
          fi

          branch=$(python3 -c "
          import json, re, sys
          with open('crates/preset_core/assets/playlist-definition.schema.json') as f:
              id_url = json.load(f)['\$id']
          m = re.search(r'/v(\d+)/', id_url)
          if not m:
              print('::error::Cannot parse version from schema \$id', file=sys.stderr)
              sys.exit(1)
          print(m.group(0).strip('/'))
          ")

          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  sync:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward version branch
        env:
          BRANCH: ${{ needs.version.outputs.branch }}
        run: |
          git fetch origin "$BRANCH" 2>/dev/null || { echo "::warning::Branch $BRANCH does not exist — skipping"; exit 0; }
          if git merge-base --is-ancestor "origin/$BRANCH" origin/main; then
            git push origin "origin/main:refs/heads/$BRANCH"
          else
            echo "::warning::$BRANCH has diverged from main — skipping fast-forward"
          fi

  publish:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publish in dependency order; --no-verify skips build (CI already tests)
          for crate in audiflow-preset-core audiflow-preset-server audiflow-preset-editor; do
            echo "Publishing $crate..."
            # Check if this version is already published
            VERSION=$(cargo metadata --no-deps --format-version 1 \
              | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; print([p['version'] for p in pkgs if p['name']=='$crate'][0])")
            if cargo search "$crate" 2>/dev/null | grep -q "^${crate} = \"${VERSION}\""; then
              echo "$crate@$VERSION already published — skipping"
            else
              cargo publish -p "$crate" --no-verify
              echo "Waiting for crates.io index to update..."
              sleep 30
            fi
          done

  build:
    needs: [version, publish]
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: packages/sp_react/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd packages/sp_react && pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
      - name: Rename binary
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then ext=".exe"; fi
          mv "target/${{ matrix.target }}/release/audiflow-editor${ext}" \
             "audiflow-editor-${{ matrix.target }}${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: audiflow-editor-*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          SEMVER: ${{ needs.version.outputs.semver }}
        run: |
          TAG="v${SEMVER}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping immutable release"
          else
            gh release create "$TAG" audiflow-editor-* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

      - name: Update mutable major-version release
        env:
          GH_TOKEN: ${{ github.token }}
          SEMVER: ${{ needs.version.outputs.semver }}
          MAJOR: ${{ needs.version.outputs.major }}
        run: |
          TAG="v${MAJOR}"

          # Delete existing mutable release and tag if present
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" 2>/dev/null || true

          # Create mutable release pointing at the same commit
          gh release create "$TAG" audiflow-editor-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG (latest v${MAJOR}.x)" \
            --notes "Mutable tag tracking the latest v${MAJOR}.x release (currently v${SEMVER})." \
            --target "$GITHUB_SHA"
