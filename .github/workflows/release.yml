name: Release

on:
  push:
    branches: ["v[0-9]+"]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
      major: ${{ steps.parse.outputs.major }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse version from Cargo.toml
        id: parse
        run: |
          semver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          major=$(echo "$semver" | cut -d. -f1)
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd packages/sp_react && pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
      - name: Rename binary
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then ext=".exe"; fi
          mv "target/${{ matrix.target }}/release/audiflow-editor${ext}" \
             "audiflow-editor-${{ matrix.target }}${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: audiflow-editor-*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          SEMVER: ${{ needs.version.outputs.semver }}
        run: |
          TAG="v${SEMVER}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping immutable release"
          else
            gh release create "$TAG" audiflow-editor-* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Update mutable major-version release
        env:
          GH_TOKEN: ${{ github.token }}
          SEMVER: ${{ needs.version.outputs.semver }}
          MAJOR: ${{ needs.version.outputs.major }}
        run: |
          TAG="v${MAJOR}"

          # Delete existing mutable release and tag if present
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" 2>/dev/null || true

          # Create mutable release pointing at the same commit
          gh release create "$TAG" audiflow-editor-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG (latest v${MAJOR}.x)" \
            --notes "Mutable tag tracking the latest v${MAJOR}.x release (currently v${SEMVER})." \
            --target "$GITHUB_SHA"
