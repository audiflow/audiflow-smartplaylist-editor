[workspace]
resolver = "2"
members = [
    "crates/preset_core",
    "crates/preset_server",
    "crates/preset_cli",
]

[workspace.package]
version = "7.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/audiflow/audiflow-preset-editor"

[workspace.dependencies]
preset_core = { package = "audiflow-preset-core", path = "crates/preset_core", version = "7.0.0" }
preset_server = { package = "audiflow-preset-server", path = "crates/preset_server", version = "7.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
